apiVersion: v1
kind: ConfigMap
metadata:
  name: comfyui-config
  namespace: comfyui
  labels:
    app: comfyui
data:
  # Python environment variables
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

  # CUDA and GPU settings
  CUDA_DEVICE_ORDER: "PCI_BUS_ID"
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

  # ComfyUI settings
  COMFYUI_PORT: "8188"
  COMFYUI_HOST: "0.0.0.0"
